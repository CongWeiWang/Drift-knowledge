<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drift — 知識漫遊</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#252820;background:#f6f5f0}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #dddcd4;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between}.logo{font:40px Georgia,serif;letter-spacing:-3px}button{font:inherit;cursor:pointer;background:transparent;border:1px solid #c8c9be;border-radius:35px;padding:10px 16px;color:inherit}button:hover{background:#eae9e2}button.active{background:#252820;color:white}.shell{max-width:1100px;margin:auto;padding:35px 22px}h1{font:normal clamp(34px,5vw,70px)/1.14 Georgia,'Noto Serif TC',serif;letter-spacing:-1.8px;margin:18px 0}p{line-height:1.9}.muted{color:#73766c}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}.hero{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center;margin-bottom:46px}.art{aspect-ratio:4/3;background:radial-gradient(circle at 50% 48%,#c1c8b6 0 15%,#d9dfd2 16% 35%,#e7e7dd 36% 54%,#c8cbbd 55%);border-radius:7px;display:flex;align-items:center;justify-content:center;font:140px Georgia,serif;color:#626d5e}.layout{display:grid;grid-template-columns:2fr 1fr;gap:28px}.panel{background:#fffefa;border:1px solid #e2e1d9;border-radius:12px;padding:27px;margin-bottom:18px}.panel h2{font-size:22px;font-weight:500;margin-top:0}.branch{display:block;width:100%;text-align:left;border-radius:8px;margin:10px 0;padding:15px}.branch small{display:block;color:#77796f;margin-bottom:5px}.source{color:inherit;text-decoration:underline;text-underline-offset:4px}.mini{font-size:13px}.list-item{border-bottom:1px solid #e4e3dc;padding:12px 0;cursor:pointer}.list-item:hover{text-decoration:underline}footer{margin:50px 0 20px;font-size:12px;color:#77796f}@media(max-width:720px){.hero,.layout{grid-template-columns:1fr}.art{aspect-ratio:16/9;font-size:80px}.shell{padding:25px 18px}header{padding:16px 18px}.hero{gap:20px}}</style></head><body><header><div class="logo">drift<span style="color:#9d9e91">.</span></div><button id="random">隨機漫遊 ↗</button></header><main class="shell"><div class="eyebrow">A small atlas of unexpected ideas · 知識漫遊</div><section class="hero"><div><h1>從一個念頭，<br>漂流到另一個世界。</h1><p class="muted">設計、藝術、哲學、文學、生物、社會與政治。每次拾獲一個陌生觀念，沒有課表，也沒有終點。</p><div id="stats" class="mini muted"></div></div><div class="art" aria-hidden="true">∿</div></section><div class="layout"><section><div class="panel" id="story"></div><div class="panel"><div class="eyebrow">Next drift / 下一站</div><h2>沿著線索走</h2><div id="branches"></div></div></section><aside><div class="panel"><h2>你的拾獲</h2><div id="saved"></div></div><div class="panel"><h2>漫遊足跡</h2><div id="trail"></div></div><div class="panel"><h2>全部收錄</h2><div id="recent"></div></div></aside></div><footer>DRIFT — Curiosity over completion. 原始來源皆可開啟閱讀。收藏及足跡保存在此瀏覽器中。</footer></main><script>
const items=[{id:'akari',title:'一盞燈，為什麼可以同時是家具與雕塑？',category:'設計史',summary:'野口勇將日本和紙燈籠的工藝帶入現代生活，創造 Akari 光雕。當光線、材料與日常用途相遇，藝術和設計之間的邊界也變得模糊。',term:'Light Sculpture｜光雕塑',source:'Wallpaper*',url:'https://www.wallpaper.com/design-interiors/lighting/isamu-noguchi-akari-history',links:['berger','ecologic','yukiko']},{id:'berger',title:'觀看，真的是一件中立的事嗎？',category:'藝術與哲學',summary:'John Berger 的《觀看的方式》提醒我們：圖像的意義與觀看者所處的社會條件有關。廣告、財產、權力與藝術史都可能改變我們理解影像的方式。',term:'Ways of Seeing｜觀看的方式',source:'The Art Newspaper',url:'https://www.theartnewspaper.com/2026/11/05/comment-john-berger-at-100-why-the-writers-legacy-is-as-vital-as-ever',links:['salcedo','akari','yukiko']},{id:'ecologic',title:'如果建築材料自己會生長？',category:'生物與建築',summary:'ecoLogicStudio 探索讓活體生物參與建築環境的設計。藻類、微生物不再只是建材，而成為具有代謝與環境反應的系統參與者。',term:'Biodesign｜生物設計',source:'designboom',url:'https://www.designboom.com/architecture/how-ecologicstudio-uses-living-organisms-to-build-better-spaces-for-living/',links:['akari','berger','salcedo']},{id:'yukiko',title:'一本書的設計，可以替內容說話嗎？',category:'編輯設計',summary:'Studio Yukiko 為《Everything At Once》探索書籍形式與後現代文化之間的關係。版面、字體與書籍物件本身，都能成為論述的一部分。',term:'Editorial Design｜編輯設計',source:'Abduzeedo',url:'https://abduzeedo.com/how-studio-yukiko-reimagined-book-design-everything-once/',links:['berger','akari','salcedo']},{id:'salcedo',title:'藝術如何讓缺席的事物被看見？',category:'當代藝術',summary:'Doris Salcedo 的藝術實踐經常處理暴力、失落與記憶。她讓材料與空間成為承載難以直接敘說之經驗的媒介。',term:'Collective Memory｜集體記憶',source:'ARTnews',url:'https://www.artnews.com/art-news/artists/doris-salcedo-blind-white-cube-house-hair-1234804779/',links:['berger','ecologic','yukiko']},{id:'caserne',title:'一個國家的電影產業，如何擁有共同的視覺語言？',category:'品牌設計',summary:'Caserne 為 Telefilm Canada 設計識別系統。公共文化機構的品牌不只需要被辨認，也需要讓多樣的影像創作者能夠共用一種視覺語言。',term:'Visual Identity｜視覺識別',source:'Abduzeedo',url:'https://abduzeedo.com/inside-telefilm-canada-brand-identity-caserne/',links:['zed','yukiko','berger']},{id:'zed',title:'五百種字型風格，如何仍然屬於同一個家族？',category:'字體設計',summary:'Typotheque 的 Zed 字型系統提出一個問題：當設計系統的變化尺度極大時，什麼樣的結構仍能維持辨識度與一致性？',term:'Type Family｜字型家族',source:'Abduzeedo',url:'https://abduzeedo.com/zed-typotheque-500-style-global-typography-system/',links:['caserne','yukiko','akari']},{id:'bond',title:'一個研究機構的品牌，能否像實驗一樣開放？',category:'品牌設計',summary:'品牌識別不必只是固定標誌，也可以是一套可以延展的視覺規則。從研究機構的案例觀察識別系統如何傳遞組織性格。',term:'Identity System｜識別系統',source:'Abduzeedo',url:'https://abduzeedo.com/branding-lab-institute-identity-bond/',links:['caserne','zed','ecologic']}];
let current=localStorage.getItem('drift-current')||'akari',saved=JSON.parse(localStorage.getItem('drift-saved')||'[]'),trail=JSON.parse(localStorage.getItem('drift-trail')||'[]');const $=id=>document.getElementById(id);function goto(id){if(!items.some(x=>x.id===id))return;current=id;trail.push(id);trail=trail.slice(-60);localStorage.setItem('drift-current',id);localStorage.setItem('drift-trail',JSON.stringify(trail));render();window.scrollTo({top:220,behavior:'smooth'})}function render(){const x=items.find(v=>v.id===current)||items[0];$('story').innerHTML='<div class="eyebrow">'+x.category+' · '+x.source+'</div><h1 style="font-size:clamp(28px,4vw,48px)">'+x.title+'</h1><p>'+x.summary+'</p><div class="eyebrow">今日拾獲的詞彙</div><p><strong>'+x.term+'</strong></p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><button id="save" class="'+(saved.includes(x.id)?'active':'')+'">'+(saved.includes(x.id)?'✓ 已收藏':'＋ 收下這個觀念')+'</button><a class="source" href="'+x.url+'" target="_blank" rel="noopener noreferrer">閱讀原文 ↗</a></div>';$('save').onclick=()=>{saved=saved.includes(x.id)?saved.filter(v=>v!==x.id):[...saved,x.id];localStorage.setItem('drift-saved',JSON.stringify(saved));render()};$('branches').innerHTML=x.links.map(id=>items.find(v=>v.id===id)).filter(Boolean).map(v=>'<button class="branch" data-id="'+v.id+'"><small>'+v.category+' · '+v.term+'</small>'+v.title+' →</button>').join('');document.querySelectorAll('.branch').forEach(b=>b.onclick=()=>goto(b.dataset.id));$('saved').innerHTML=saved.length?saved.map(id=>items.find(v=>v.id===id)).filter(Boolean).map(v=>'<div class="list-item" data-id="'+v.id+'">'+v.term+'</div>').join(''):'<p class="mini muted">收藏的觀念會留在這裡。</p>';$('trail').innerHTML=trail.length?trail.slice(-8).reverse().map(id=>items.find(v=>v.id===id)).filter(Boolean).map(v=>'<div class="list-item" data-id="'+v.id+'">'+v.title+'</div>').join(''):'<p class="mini muted">你的旅程才剛開始。</p>';$('recent').innerHTML=items.map(v=>'<div class="list-item" data-id="'+v.id+'">'+v.title+'</div>').join('');document.querySelectorAll('.list-item').forEach(e=>e.onclick=()=>goto(e.dataset.id));$('stats').textContent=items.length+' 個知識節點 · '+saved.length+' 個拾獲 · '+trail.length+' 次漫遊'}$('random').onclick=()=>goto(items[Math.floor(Math.random()*items.length)].id);render();
</script></body></html>
